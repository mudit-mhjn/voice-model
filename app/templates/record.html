{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Patient Recording</h2>
  <p class="muted">
    Record a sustained vowel (e.g., “aaa”) or normal speech. Longer recordings are split into 3s segments.
  </p>

  <form class="form" action="/predict" method="post" enctype="multipart/form-data" id="predictForm">
    <div class="grid3" style="margin-bottom: 24px;">
      <label class="input-field">
        Name
        <input name="name" required placeholder="e.g., John Doe"/>
      </label>
      <label class="input-field">
        Age
        <input name="age" required placeholder="e.g., 25" />
      </label>
      <label>
        Gender
        <select name="gender" required>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other / Prefer not to say</option>
        </select>
      </label>
    </div>

    <div style="margin-bottom: 20px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,0.02);">
        <label style="display: flex; gap: 8px; font-weight: 600; margin-bottom: 0;">
          Upload a File
          <input type="file" name="audio" id="audioFileUpload" accept="audio/wav, audio/x-wav, audio/mpeg, audio/mp3, audio/x-m4a" style="display: none;" />
          <label for="audioFileUpload" class="custom-file-upload">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: #000000;">
              <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M17 8L12 3L7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 3V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Choose file
          </label>
        </label>
        <div id="uploadedFileDisplay" style="display: none; margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--line);">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span style="font-size: 20px;">🎵</span>
              <span id="uploadedFileName" style="color: var(--text); font-weight: 500;"></span>
            </div>
        </div>
        <p class="muted" style="margin-top: 8px; margin-bottom: 0; font-size: 13px;">Or use the recording controls below</p>
    </div>

    <div class="recorder card soft" style="margin-top: 20px;">
      <div class="row" style="margin-bottom: 16px;">
        <button type="button" class="btn" id="startBtn">● Start recording</button>
        <button type="button" class="btn secondary" id="stopBtn" disabled>■ Stop</button>
        <span id="timer" class="pill">00:00</span>
      </div>

      <audio id="playback" controls class="full" style="margin-top: 10px; margin-bottom: 16px;"></audio>
      <input type="file" name="audio" id="audioFile" accept="audio/wav" required hidden />
      <div class="row">
        <button type="submit" class="btn primary" id="submitBtn" disabled>Run predictions</button>
        <span class="muted"></span>
      </div>
    </div>
  </form>
</section>
{% endblock %}
